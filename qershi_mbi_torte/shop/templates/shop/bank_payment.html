{% extends "shop/navbar_footer.html" %}
{% block content %}
<style>
.bank-container {
    max-width: 600px;
    margin: 60px auto;
    padding: 30px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    text-align: center;
}

.bank-container h1 {
    color: #c33;
    margin-bottom: 15px;
}

.bank-container h2 {
    margin-bottom: 15px;
}

.bank-container p {
    margin-bottom: 25px;
    line-height: 1.6;
}

.btns {
    display: flex;
    justify-content: center;
}

.btns a {
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    background: #c33;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: background 0.3s ease, transform 0.2s ease;
}

.btns a:hover {
    background: #a22;
    transform: scale(1.05);
}
</style>

<div class="bank-container">
  <h1>Pagesa me Bankë</h1>
  <h2>Ju kërkojmë ndjesë!</h2>
  <p>Momentalisht ofrojmë vetëm mundësinë e pagesës <strong>Cash</strong>.
     Po punojmë për të përmirësuar faqen tonë.
     Faleminderit për durimin tuaj dhe rikthehuni së shpejti!</p>

  <div class="btns">
    <a href="{% url 'products' %}">Shfleto Produktet</a>
  </div>
</div>
{% endblock %}
